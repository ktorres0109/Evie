name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm --filter ./app build
      - name: Unit tests
        run: pnpm --filter ./app test
      - name: Worker tests
        run: pnpm --filter "./workers/*" --if-present test

  android:
    # Builds the real Android app (debug, unsigned for stores) and keeps the APK
    # as a downloadable artifact, so the native rename is verified on every push.
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle for native
        run: pnpm --filter ./app build:native
      - name: Copy bundle into the Android project
        working-directory: app
        run: npx cap sync android
      - name: Native unit tests and debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: meztli-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
